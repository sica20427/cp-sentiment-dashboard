<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP Group — Sentiment Monitoring Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#05070E;
    --navy-2:#0F1730;
    --bg:#0B0D14;
    --card:#151824;
    --text-primary:#EDEEF3;
    --text-secondary:#9CA0B3;
    --text-faint:#6B7086;
    --positive:#2FCC8F;
    --positive-bg:#122A22;
    --positive-border:#1E4A38;
    --negative:#F0554D;
    --negative-bg:#2E1618;
    --negative-border:#4A2226;
    --accent:#C42A42;
    --accent-2:#E1546A;
    --border:#252A3A;
    --radius:18px;
    --radius-sm:10px;
    --gap:22px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 1px 1px rgba(0,0,0,.2);
    --shadow-md:0 2px 8px rgba(0,0,0,.35), 0 12px 28px -12px rgba(0,0,0,.5);
    --shadow-lg:0 10px 26px -6px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 100% -10%, rgba(225,84,106,0.08), transparent 60%),
      var(--bg);
    color:var(--text-primary);
    font-family:'IBM Plex Sans Thai','IBM Plex Mono',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1360px;margin:0 auto;padding:32px 28px 72px;}
  ::selection{background:rgba(166,25,46,0.18);}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* ---------- Header ---------- */
  .dashboard-header{
    background:
      radial-gradient(900px 260px at 110% -30%, rgba(214,69,92,0.35), transparent 60%),
      linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%);
    border-radius:var(--radius);
    padding:30px 32px;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:18px;
    margin-bottom:28px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
  }
  .header-left{display:flex;align-items:center;gap:16px;position:relative;z-index:1;}
  .brand-mark{
    width:48px;height:48px;border-radius:13px;
    background:linear-gradient(150deg,var(--accent-2),var(--accent));
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;letter-spacing:0.5px;
    flex-shrink:0;
    box-shadow:0 6px 16px -4px rgba(166,25,46,0.55);
  }
  .header-left h1{margin:0;font-size:20.5px;font-weight:700;letter-spacing:0.1px;}
  .header-left .subtitle{margin-top:4px;font-size:12.5px;color:rgba(255,255,255,0.62);display:flex;align-items:center;gap:7px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#3DDC8C;box-shadow:0 0 0 3px rgba(61,220,140,0.18);flex-shrink:0;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px;position:relative;z-index:1;}
  .period-filter{display:flex;gap:3px;background:rgba(255,255,255,0.07);padding:4px;border-radius:11px;border:1px solid rgba(255,255,255,0.08);}
  .period-filter button{
    border:none;background:transparent;color:rgba(255,255,255,0.62);
    font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:8px;cursor:pointer;
    transition:all .18s ease;
  }
  .period-filter button:hover{color:#fff;background:rgba(255,255,255,0.06);}
  .period-filter button.active{background:linear-gradient(150deg,var(--accent-2),var(--accent));color:#fff;font-weight:600;box-shadow:0 3px 10px -2px rgba(166,25,46,0.5);}
  .period-range{font-size:11.5px;color:rgba(255,255,255,0.5);font-family:'IBM Plex Mono',monospace;}
  .custom-range{display:none;gap:8px;align-items:center;margin-top:4px;}
  .custom-range.show{display:flex;}
  .custom-range input{
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 9px;border-radius:8px;
    border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.07);color:#fff;
  }
  .custom-range button{
    font-family:inherit;font-size:12px;padding:6px 14px;border-radius:8px;border:none;
    background:linear-gradient(150deg,var(--accent-2),var(--accent));color:#fff;cursor:pointer;font-weight:600;
  }

  /* ---------- Section headings ---------- */
  .section{margin-bottom:40px;}
  .section-title{display:flex;align-items:baseline;gap:11px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .section-eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.6px;
    color:var(--accent);text-transform:uppercase;font-weight:600;
  }
  .section-title h2{margin:0;font-size:17px;font-weight:700;color:var(--text-primary);letter-spacing:-0.1px;}
  .section-note{font-size:12px;color:var(--text-faint);margin-top:-6px;margin-bottom:14px;}

  /* ---------- BU grid ---------- */
  .bu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
    gap:var(--gap);
  }
  .bu-card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .bu-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .bu-card-header{
    display:flex;align-items:center;gap:14px;
    padding:22px 22px 18px;
    background:#191D2A;
  }
  .bu-code{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
    background:var(--navy);color:#fff;padding:6px 13px;border-radius:8px;letter-spacing:0.5px;
  }
  .bu-logo{
    height:44px;width:auto;max-width:130px;object-fit:contain;
    flex-shrink:0;
    background:#fff;border-radius:8px;padding:5px 9px;
  }
  .bu-logo.hidden{display:none;}
  .bu-name{font-weight:700;font-size:14.5px;flex:1;letter-spacing:-0.1px;}
  .bu-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);background:var(--bg);padding:4px 10px;border-radius:7px;margin-left:auto;}

  .ratio-caption{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-faint);
    margin:0 20px 5px;letter-spacing:0.2px;
  }
  .ratio-bar{height:5px;margin:0 20px 16px;border-radius:99px;overflow:hidden;background:var(--border);display:flex;}
  .ratio-bar .seg-pos{background:var(--positive);height:100%;}
  .ratio-bar .seg-neg{background:var(--negative);height:100%;}
  .ratio-bar .seg-neu{background:#3A4056;height:100%;}

  .sentiment-columns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);}
  .sentiment-col{padding:16px 18px;}
  .sentiment-col.positive{border-right:1px solid var(--border);}
  .col-label{
    font-size:10.5px;font-weight:700;letter-spacing:0.5px;margin-bottom:12px;
    display:flex;align-items:center;gap:6px;text-transform:uppercase;
  }
  .col-label.pos{color:var(--positive);}
  .col-label.neg{color:var(--negative);}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .dot.pos{background:var(--positive);}
  .dot.neg{background:var(--negative);}

  .news-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
  .news-item{
    border-left:2.5px solid var(--positive-border);
    padding:8px 10px;
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    transition:background .15s ease;
  }
  .news-item:hover{background:var(--positive-bg);}
  .sentiment-col.negative .news-item{border-left-color:var(--negative-border);}
  .sentiment-col.negative .news-item:hover{background:var(--negative-bg);}
  .news-title{font-size:12.5px;line-height:1.5;color:var(--text-primary);}
  .news-meta{display:flex;gap:7px;margin-top:5px;font-size:10.5px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;flex-wrap:wrap;align-items:center;}
  .news-meta .src{color:var(--text-secondary);font-weight:600;}
  .news-link{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;font-weight:600;}
  .news-link:hover{border-bottom-color:var(--accent);}
  .empty-note{font-size:12px;color:var(--text-faint);font-style:italic;}

  /* ---------- Priority issue grid ---------- */
  .issue-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(440px,1fr));
    gap:var(--gap);
  }
  .issue-card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .issue-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .issue-card-header{
    display:flex;align-items:center;gap:15px;
    padding:22px 24px;
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;
  }
  .issue-icon{
    width:50px;height:50px;border-radius:13px;background:rgba(255,255,255,0.1);
    display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0;
  }
  .issue-name{font-weight:700;font-size:18px;flex:1;letter-spacing:-0.1px;}
  .issue-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,0.6);}
  .issue-card .ratio-caption{margin:14px 22px 5px;}
  .issue-card .ratio-bar{margin:0 22px 0;}
  .issue-card .sentiment-columns{grid-template-columns:1fr 1fr;border-top:none;margin-top:12px;}
  .issue-card .sentiment-col{padding:14px 20px 20px;}

  /* ---------- Footer ---------- */
  .dashboard-footer{
    margin-top:14px;padding-top:18px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    font-size:11.5px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;
  }
  .sample-banner{
    background:var(--card);border:1px solid var(--border);border-left:3px solid var(--positive);color:var(--text-secondary);
    border-radius:var(--radius-sm);padding:13px 18px;font-size:12px;line-height:1.6;margin-bottom:26px;
    display:flex;align-items:flex-start;gap:10px;box-shadow:var(--shadow-sm);
  }
  .sample-banner strong{color:var(--text-primary);}

  @media (max-width:600px){
    .wrap{padding:20px 16px 56px;}
    .dashboard-header{flex-direction:column;align-items:flex-start;padding:24px 22px;}
    .header-right{align-items:flex-start;width:100%;}
    .sentiment-columns{grid-template-columns:1fr;}
    .sentiment-col.positive{border-right:none;border-bottom:1px solid var(--border);}
  }
</style>
</head>

</div>

let currentFilter = { mode:"24h", maxHours:24 };

function fmtNum(n){
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,"") + "K";
  return n.toString();
}

function hoursAgoOf(item){
  if(!item.postTime) return 9999;
  const now = new Date();
  const t = new Date(item.postTime);
  return (now - t) / 3600000;
}

function relTime(item){
  const h = hoursAgoOf(item);
  if(h<1) return "เมื่อสักครู่";
  if(h<24) return `${Math.round(h)} ชม.ที่แล้ว`;
  const d = Math.round(h/24);
  return `${d} วันที่แล้ว`;
}

function withinFilter(item){
  return hoursAgoOf(item) <= currentFilter.maxHours;
}

function newsListHTML(items, sentiment){
  const filtered = items.filter(withinFilter).sort((a,b)=>b.engagement-a.engagement).slice(0,3);
  if(filtered.length===0){
    return `<div class="empty-note">ไม่มีข้อความในช่วงเวลาที่เลือก</div>`;
  }
  return `<ul class="news-list">` + filtered.map(it => `
    <li class="news-item">
      <div class="news-title">${it.title}</div>
      <div class="news-meta">
        <span class="src">${it.source}</span>
        <span>·</span>
        <span>${fmtNum(it.engagement)} engagement</span>
        <span>·</span>
        <span>${relTime(it)}</span>
        <span>·</span>
        ${it.url ? `<a class="news-link" href="${it.url}" target="_blank" rel="noopener" style="cursor:pointer;">ลิงก์โพสต์</a>` : `<span style="color:var(--text-faint);">ไม่มีลิงก์</span>`}
      </div>
    </li>`).join("") + `</ul>`;
}

function ratioBarHTML(positive, negative, neutralTimes){
  const posN = positive.filter(withinFilter).length;
  const negN = negative.filter(withinFilter).length;
  const neuN = (neutralTimes || []).filter(t => withinFilter({postTime:t})).length;
  const total = posN + negN + neuN;
  if(total === 0){
    return `<div class="ratio-caption">สัดส่วน Positive/Negative/Neutral · นับจาก mention</div><div class="ratio-bar"><div class="seg-neu" style="width:100%;"></div></div>`;
  }
  const posPct = (posN/total*100).toFixed(1);
  const negPct = (negN/total*100).toFixed(1);
  const neuPct = (neuN/total*100).toFixed(1);
  return `<div class="ratio-caption">สัดส่วน Positive/Negative/Neutral · นับจาก mention (${posN} Positive / ${negN} Negative / ${neuN} Neutral)</div>
  <div class="ratio-bar" title="${posN} Positive / ${negN} Negative / ${neuN} Neutral ในช่วงเวลาที่เลือก — นับจากจำนวน mention">
    <div class="seg-pos" style="width:${posPct}%;"></div>
    <div class="seg-neg" style="width:${negPct}%;"></div>
    <div class="seg-neu" style="width:${neuPct}%;"></div>
  </div>`;
}

function renderBU(){
  const grid = document.getElementById("buGrid");
  grid.innerHTML = BU_DATA.map(bu => `
    <div class="bu-card">
      <div class="bu-card-header">
        <img class="bu-logo" src="${BU_LOGOS[bu.code] || ''}" alt="${bu.code} logo" onerror="this.classList.add('hidden')">
        <span class="bu-code">${bu.code}</span>
      </div>
      <div class="sentiment-columns">
        <div class="sentiment-col positive">
          <div class="col-label pos"><span class="dot pos"></span>Top 3 Positive</div>
          ${newsListHTML(bu.positive, "positive")}
        </div>
        <div class="sentiment-col negative">
          <div class="col-label neg"><span class="dot neg"></span>Top 3 Negative</div>
          ${newsListHTML(bu.negative, "negative")}
        </div>
      </div>
    </div>
  `).join("");
}

function renderIssues(){
  const grid = document.getElementById("issueGrid");
  grid.innerHTML = ISSUE_DATA.map(is => `
    <div class="issue-card">
      <div class="issue-card-header">
        <div class="issue-icon">${is.icon}</div>
        <div class="issue-name">${is.name}</div>
      </div>
      <div class="sentiment-columns">
        <div class="sentiment-col positive">
          <div class="col-label pos"><span class="dot pos"></span>Top 3 Positive</div>
          ${newsListHTML(is.positive, "positive")}
        </div>
        <div class="sentiment-col negative">
          <div class="col-label neg"><span class="dot neg"></span>Top 3 Negative</div>
          ${newsListHTML(is.negative, "negative")}
        </div>
      </div>
    </div>
  `).join("");
}

function renderAll(){
  renderBU();
  renderIssues();
}

function updatePeriodRange(){
  const now = new Date();
  const el = document.getElementById("periodRange");
  const fmt = d => d.toLocaleDateString("th-TH", {day:"2-digit",month:"short",year:"numeric"}) + " " +
                   d.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});
  if(currentFilter.mode==="24h"){
    const start = new Date(now.getTime() - 24*3600*1000);
    el.textContent = `${fmt(start)} — ${fmt(now)}`;
  } else if(currentFilter.mode==="7d"){
    const start = new Date(now.getTime() - 7*24*3600*1000);
    el.textContent = `${fmt(start)} — ${fmt(now)}`;
  } else {
    el.textContent = `กำหนดช่วงเวลาเอง (${currentFilter.maxHours} ชม.ล่าสุด)`;
  }
}

document.getElementById("periodFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  [...document.querySelectorAll("#periodFilter button")].forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  const mode = btn.dataset.period;
  const customRange = document.getElementById("customRange");
  if(mode==="24h"){ currentFilter={mode, maxHours:24}; customRange.classList.remove("show"); }
  else if(mode==="7d"){ currentFilter={mode, maxHours:24*7}; customRange.classList.remove("show"); }
  else { customRange.classList.add("show"); }
  updatePeriodRange();
  renderAll();
});

document.getElementById("applyCustom").addEventListener("click", () => {
  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;
  if(!start || !end) return;
  const startDate = new Date(start);
  const endDate = new Date(end + "T23:59:59");
  const now = new Date();
  const maxHours = Math.max(1, (now - startDate) / 3600000);
  currentFilter = { mode:"custom", maxHours };
  updatePeriodRange();
  renderAll();
});

document.getElementById("lastUpdated").textContent = new Date().toLocaleString("th-TH", {
  day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"
});

updatePeriodRange();
renderAll();
</script>
